<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>커버</title>
    <style>
      :root {
        --navy: #16293f;
        --blue: #2eaae4;
        --text: #191919;
        --sub: #787774;
        --surface: #f7f6f3;
        --border: #e9e9e7;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; }
      body {
        font-family: 'Malgun Gothic', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
        background: var(--surface);
        -webkit-font-smoothing: antialiased;
      }
      .frame {
        width: 100vw; height: 100vh;
        display: flex; flex-direction: column;
        justify-content: center;
        padding: 0 90px;
        background: #ffffff;
        position: relative;
        overflow: hidden;
      }
      .accent-bar {
        position: absolute; left: 0; top: 0;
        width: 14px; height: 100%;
        background: linear-gradient(180deg, var(--navy) 0%, var(--blue) 100%);
      }
      .eyebrow {
        font-size: 22px; font-weight: 700; letter-spacing: 0.12em;
        color: var(--blue); text-transform: uppercase; margin-bottom: 26px;
      }
      h1 {
        font-size: 66px; font-weight: 800; line-height: 1.28;
        color: var(--navy); letter-spacing: -0.03em; margin-bottom: 40px;
      }
      h1 .hl {
        color: #ffffff; background: var(--navy);
        padding: 2px 16px; border-radius: 8px;
      }
      .stats { display: flex; gap: 64px; align-items: flex-end; }
      .stat-num {
        font-size: 62px; font-weight: 800; color: var(--blue);
        line-height: 1; letter-spacing: -0.02em;
      }
      .stat-num.zero { color: #e0563f; }
      .stat-label { font-size: 20px; color: var(--sub); font-weight: 600; margin-top: 12px; }
      .divider { width: 2px; height: 74px; background: var(--border); }
      .footer-mark {
        position: absolute; right: 70px; bottom: 52px;
        font-size: 24px; font-weight: 800; color: var(--navy); letter-spacing: -0.01em;
      }
      .footer-mark span { color: var(--blue); }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="accent-bar"></div>
      <p class="eyebrow">8월 2주차</p>
      <h1>반려동물 몰래 데리고 다니기,<br />2주 연속 <span class="hl">더 퍼지는 중</span></h1>
      <div class="stats">
        <div>
          <div class="stat-num">224배</div>
          <div class="stat-label">평소 올리던 영상 대비</div>
        </div>
        <div class="divider"></div>
        <div>
          <div class="stat-num zero">0건</div>
          <div class="stat-label">국내엔 동일 구조 없음</div>
        </div>
      </div>
      <div class="footer-mark">Early<span>Catch</span></div>
    </div>
  </body>
</html>
