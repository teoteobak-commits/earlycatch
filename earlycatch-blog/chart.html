<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>3주 추적 차트</title>
    <style>
      :root {
        --navy: #16293f;
        --blue: #2eaae4;
        --text: #191919;
        --sub: #787774;
        --border: #e9e9e7;
        --red: #e0563f;
        --gray: #a5a5a2;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; }
      body {
        font-family: 'Malgun Gothic', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
        background: #ffffff;
        -webkit-font-smoothing: antialiased;
      }
      .frame {
        width: 100vw; height: 100vh;
        padding: 54px 60px 44px;
        display: flex; flex-direction: column;
      }
      h2 {
        font-size: 36px; font-weight: 800; color: var(--navy);
        letter-spacing: -0.02em; margin-bottom: 8px;
      }
      .sub { font-size: 19px; color: var(--sub); margin-bottom: 8px; }
      .legend { display: flex; gap: 34px; margin: 18px 0 4px; }
      .legend-item { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 600; color: var(--text); }
      .dot { width: 15px; height: 15px; border-radius: 50%; }
      .note {
        margin-top: auto; font-size: 17px; color: var(--sub); line-height: 1.6;
        border-top: 1px solid var(--border); padding-top: 18px;
      }
      svg { width: 100%; flex: 1; }
      .grid-line { stroke: var(--border); stroke-width: 1.5; }
      .axis-label { font-size: 17px; fill: var(--sub); font-family: 'Malgun Gothic', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
      .x-label { font-size: 20px; fill: var(--text); font-weight: 700; font-family: 'Malgun Gothic', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
      .val-label { font-size: 18px; font-weight: 700; font-family: 'Malgun Gothic', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
    </style>
  </head>
  <body>
    <div class="frame">
      <h2>인스타와 틱톡이 반대로 갔습니다</h2>
      <p class="sub">평소보다 몇 배나 퍼졌나, 2주치</p>

      <div class="legend">
        <div class="legend-item"><span class="dot" style="background:#2eaae4"></span>반려동물 몰래 데리고 다니기 (틱톡)</div>
        <div class="legend-item"><span class="dot" style="background:#16293f"></span>POV 감성 서사 릴스 (인스타그램)</div>
      </div>

      <svg viewBox="0 0 1200 560" preserveAspectRatio="xMidYMid meet">
        <!-- grid -->
        <line class="grid-line" x1="130" y1="480" x2="1160" y2="480" />
        <line class="grid-line" x1="130" y1="380" x2="1160" y2="380" stroke-dasharray="5,6" />
        <line class="grid-line" x1="130" y1="280" x2="1160" y2="280" stroke-dasharray="5,6" />
        <line class="grid-line" x1="130" y1="180" x2="1160" y2="180" stroke-dasharray="5,6" />
        <line class="grid-line" x1="130" y1="80" x2="1160" y2="80" stroke-dasharray="5,6" />

        <text class="axis-label" x="112" y="486" text-anchor="end">0배</text>
        <text class="axis-label" x="112" y="386" text-anchor="end">300배</text>
        <text class="axis-label" x="112" y="286" text-anchor="end">600배</text>
        <text class="axis-label" x="112" y="186" text-anchor="end">900배</text>
        <text class="axis-label" x="112" y="86" text-anchor="end">1200배</text>

        <!-- POV 감성 서사 릴스 : 1188 -> 339 -->
        <polyline points="290,84 1000,367" fill="none" stroke="#16293f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="290" cy="84" r="9" fill="#16293f" />
        <circle cx="1000" cy="367" r="8" fill="#16293f" />
        <text class="val-label" fill="#16293f" x="290" y="66" text-anchor="middle">1188배</text>
        <text class="val-label" fill="#16293f" x="925" y="345" text-anchor="middle">339배</text>

        <!-- 반려동물 몰래 데리고 다니기 : 126 -> 224 -->
        <polyline points="290,438 1000,405" fill="none" stroke="#2eaae4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="290" cy="438" r="9" fill="#2eaae4" />
        <circle cx="1000" cy="405" r="11" fill="#2eaae4" stroke="#ffffff" stroke-width="3" />
        <text class="val-label" fill="#1c8fc4" x="290" y="466" text-anchor="middle">126배</text>
        <text class="val-label" fill="#1c8fc4" x="1075" y="438" text-anchor="middle">224배</text>

        <text class="x-label" x="290" y="522" text-anchor="middle">1주차</text>
        <text class="x-label" x="1000" y="522" text-anchor="middle">2주차 (이번 주)</text>
      </svg>

      <p class="note">
        반려동물 쪽은 2주째 오르는 중입니다. 같은 방식으로 잰 POV 쪽은 반대로 내려갔고요.
        방향이 갈리면 왜 갈리는지부터 봐야 합니다.
      </p>
    </div>
  </body>
</html>
