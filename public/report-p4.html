<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>이번 주 갭 리스트</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #2383e2; --text: #191919; --sub: #787774;
        --bg: #ffffff; --surface: #f7f6f3; --border: #e9e9e7;
        --font: 'Inter', -apple-system, 'Malgun Gothic', sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      body { font-family: var(--font); background: var(--surface); color: var(--text); -webkit-font-smoothing: antialiased; }
      .page { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
      .sheet { width: 100%; max-width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 56px 48px; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--sub); margin: 0 0 8px; }
      h1 { font-size: 27px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 4px; }
      .subtitle { font-size: 15px; color: var(--sub); margin: 0 0 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
      .gap-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; }
      .gap-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
      .gap-badge { font-size: 11px; font-weight: 700; color: #fff; background: var(--primary); border-radius: 999px; padding: 3px 11px; }
      .gap-title { font-size: 15px; font-weight: 700; }
      .gap-body { font-size: 13px; color: var(--sub); line-height: 1.6; margin: 0; }
      .watermark { text-align: center; font-size: 12px; color: var(--sub); margin-top: 8px; }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="sheet">
        <p class="eyebrow">4장 · 본문 발췌</p>
        <h1>이번 주 갭 리스트</h1>
        <p class="subtitle">TEO 트렌드 스카우팅 리포트</p>

        <div class="gap-card">
          <div class="gap-head">
            <span class="gap-badge">신뢰도 높음</span>
            <span class="gap-title">Haaland (Ha Ha Ha) 밈챌린지</span>
          </div>
          <p class="gap-body">선수 이름 + 반복 사운드 밈챌린지. 서로 다른 채널에서 3주 연속 반복 확인. 한국 데이터 89건 중 0건.</p>
        </div>

        <div class="gap-card">
          <div class="gap-head">
            <span class="gap-badge">신뢰도 중간</span>
            <span class="gap-title">Roblox Animal Hospital</span>
          </div>
          <p class="gap-body">게임 세계관 스토리텔링 콘텐츠. 로블록스 인지도는 한국에도 높아 진입장벽 낮음.</p>
        </div>

        <div class="watermark">나머지 2개 갭 상세 + 활용 가이드는 구매 후 확인 가능</div>
      </div>
    </div>
  </body>
</html>
