<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>이 리포트가 다른 이유</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #2383e2; --text: #191919; --sub: #787774;
        --bg: #ffffff; --surface: #f7f6f3; --border: #e9e9e7;
        --font: 'Inter', -apple-system, 'Malgun Gothic', sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      body { font-family: var(--font); background: var(--surface); color: var(--text); -webkit-font-smoothing: antialiased; }
      .page { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
      .sheet { width: 100%; max-width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 56px 48px; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--sub); margin: 0 0 8px; }
      h1 { font-size: 27px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 4px; }
      .subtitle { font-size: 15px; color: var(--sub); margin: 0 0 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
      p.body { font-size: 16px; line-height: 1.8; margin: 0 0 20px; }
      .quote { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; font-size: 15px; color: var(--sub); line-height: 1.7; }
      .quote b { color: var(--primary); }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="sheet">
        <p class="eyebrow">1장 · 본문 발췌</p>
        <h1>이 리포트가 다른 이유</h1>
        <p class="subtitle">TEO 트렌드 스카우팅 리포트</p>
        <p class="body">
          유튜브 트렌드 리포트는 많습니다. 대부분 "지금 한국에서 뭐가 뜨는지"를 알려줍니다.
          문제는 — 그걸 아는 시점엔 이미 다른 사람들도 다 압니다.
        </p>
        <div class="quote">
          이 리포트는 반대로 갑니다. <b>해외에서 먼저 터진 뒤, 아직 한국 숏폼엔 안 들어온 것</b>을
          찾습니다. 많은 HYPE 아이템이 해외에서 먼저 검증되고 몇 주~몇 달 뒤 한국으로 넘어오는
          패턴이 실제로 반복되기 때문입니다. 먼저 알면, 먼저 만들 수 있습니다.
        </div>
      </div>
    </div>
  </body>
</html>
