<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>핵심 원칙 3가지</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #2383e2; --text: #191919; --sub: #787774;
        --bg: #ffffff; --surface: #f7f6f3; --border: #e9e9e7;
        --font: 'Inter', -apple-system, 'Malgun Gothic', sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      body { font-family: var(--font); background: var(--surface); color: var(--text); -webkit-font-smoothing: antialiased; }
      .page { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
      .sheet { width: 100%; max-width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 56px 48px; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--sub); margin: 0 0 8px; }
      h1 { font-size: 27px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 4px; }
      .subtitle { font-size: 15px; color: var(--sub); margin: 0 0 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
      .item { display: flex; gap: 16px; margin-bottom: 22px; }
      .item:last-child { margin-bottom: 0; }
      .num { flex-shrink: 0; width: 44px; height: 44px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: var(--primary); }
      .item h2 { font-size: 18px; font-weight: 700; margin: 4px 0 6px; }
      .item p { font-size: 15px; color: var(--sub); line-height: 1.6; margin: 0; }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="sheet">
        <p class="eyebrow">2장 · 본문 발췌</p>
        <h1>핵심 원칙 3가지</h1>
        <p class="subtitle">새티스파잉(Satisfying) 숏폼 제작 가이드</p>

        <div class="item">
          <div class="num">1</div>
          <div>
            <h2>리듬 = 반복 + 예측 가능성</h2>
            <p>사람들은 다음에 뭐가 나올지 대충 예상될 때 오히려 편안하게 몰입합니다.</p>
          </div>
        </div>
        <div class="item">
          <div class="num">2</div>
          <div>
            <h2>사운드가 절반이다</h2>
            <p>전용 마이크가 없어도 괜찮습니다. 소리 나는 지점에 최대한 가깝게 두면 충분합니다.</p>
          </div>
        </div>
        <div class="item">
          <div class="num">3</div>
          <div>
            <h2>컷은 적을수록 강하다</h2>
            <p>한 장면을 충분히 오래 보여주는 것이 빠른 편집보다 훨씬 강력합니다.</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
