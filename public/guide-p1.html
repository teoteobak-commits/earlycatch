<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>목차</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #2383e2;
        --text: #191919;
        --sub: #787774;
        --bg: #ffffff;
        --surface: #f7f6f3;
        --border: #e9e9e7;
        --font: 'Inter', -apple-system, 'Malgun Gothic', sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      body {
        font-family: var(--font);
        background: var(--surface);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      .page {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .sheet {
        width: 100%;
        max-width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 56px 48px;
      }
      .eyebrow {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--sub);
        margin: 0 0 10px;
      }
      h1 {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.01em;
        margin: 0 0 6px;
      }
      .subtitle {
        font-size: 16px;
        color: var(--sub);
        margin: 0 0 32px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--border);
      }
      ol {
        list-style: none;
        margin: 0;
        padding: 0;
        counter-reset: item;
      }
      li {
        counter-increment: item;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 0;
        border-bottom: 1px solid var(--border);
        font-size: 18px;
        font-weight: 500;
      }
      li:last-child { border-bottom: none; }
      li::before {
        content: counter(item);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: var(--surface);
        border: 1px solid var(--border);
        font-size: 15px;
        font-weight: 700;
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="sheet">
        <p class="eyebrow">목차</p>
        <h1>새티스파잉(Satisfying) 숏폼 제작 가이드</h1>
        <p class="subtitle">전체 6장 · A4 약 4페이지</p>
        <ol>
          <li>왜 지금 이 포맷인가 (데이터 근거)</li>
          <li>핵심 원칙 3가지</li>
          <li>카테고리별 촬영 앵글 체크리스트</li>
          <li>편집 리듬 가이드</li>
          <li>촬영 전 체크리스트</li>
          <li>채널 시작 첫 2주 실행 플랜</li>
        </ol>
      </div>
    </div>
  </body>
</html>
