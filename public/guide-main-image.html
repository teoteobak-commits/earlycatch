<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>메인 이미지</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      .frame {
        width: 100vw;
        height: 100vh;
        background: #f7f6f3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: 'Inter', sans-serif;
        padding: 40px;
        box-sizing: border-box;
      }
      .badge {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #787774;
        background: #ffffff;
        border: 1px solid #e9e9e7;
        border-radius: 999px;
        padding: 6px 16px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.35;
        color: #191919;
        margin: 0 0 20px;
      }
      p {
        font-size: 18px;
        color: #787774;
        margin: 0;
        line-height: 1.5;
      }
      .accent {
        color: #2383e2;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <span class="badge">디지털 가이드 · PDF</span>
      <h1>얼굴 없이, 편집 없이<br /><span class="accent">새티스파잉</span> 숏폼 시작하기</h1>
      <p>데이터로 검증한 촬영·편집 체크리스트</p>
    </div>
  </body>
</html>
