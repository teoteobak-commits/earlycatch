<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>편집 리듬 가이드</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #2383e2; --text: #191919; --sub: #787774;
        --bg: #ffffff; --surface: #f7f6f3; --border: #e9e9e7;
        --font: 'Inter', -apple-system, 'Malgun Gothic', sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      body { font-family: var(--font); background: var(--surface); color: var(--text); -webkit-font-smoothing: antialiased; }
      .page { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
      .sheet { width: 100%; max-width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 56px 48px; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--sub); margin: 0 0 8px; }
      h1 { font-size: 27px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 4px; }
      .subtitle { font-size: 15px; color: var(--sub); margin: 0 0 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
      table { width: 100%; border-collapse: collapse; font-size: 16px; }
      th, td { text-align: left; padding: 16px 12px; border-bottom: 1px solid var(--border); }
      th { color: var(--sub); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
      td:first-child { font-weight: 600; color: var(--text); width: 40%; }
      td:last-child { color: var(--primary); font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="sheet">
        <p class="eyebrow">4장 · 본문 발췌</p>
        <h1>편집 리듬 가이드</h1>
        <p class="subtitle">새티스파잉(Satisfying) 숏폼 제작 가이드</p>
        <table>
          <tr><th>항목</th><th>권장값</th></tr>
          <tr><td>평균 컷 길이</td><td>3~5초</td></tr>
          <tr><td>배경음악</td><td>없음 (원본 사운드만)</td></tr>
          <tr><td>자막</td><td>제목 한 줄만</td></tr>
          <tr><td>전체 길이</td><td>15~30초</td></tr>
        </table>
      </div>
    </div>
  </body>
</html>
