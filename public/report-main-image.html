<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>메인 이미지</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      .frame {
        width: 100vw; height: 100vh;
        background: #f7f6f3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; font-family: 'Inter', sans-serif; padding: 40px; box-sizing: border-box;
      }
      .badge {
        font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
        color: #787774; background: #ffffff; border: 1px solid #e9e9e7; border-radius: 999px;
        padding: 6px 16px; margin-bottom: 20px;
      }
      .number-row {
        display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px;
      }
      .number { font-size: 88px; font-weight: 800; letter-spacing: -0.03em; color: #2383e2; line-height: 1; }
      .number-unit { font-size: 28px; font-weight: 800; color: #2383e2; }
      .number-label { font-size: 15px; font-weight: 700; color: #9b9a97; margin-bottom: 22px; letter-spacing: 0.02em; }
      h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.4; color: #191919; margin: 0 0 14px; }
      p { font-size: 16px; color: #787774; margin: 0; line-height: 1.5; }
      .accent { color: #2383e2; }
      .tag { display: inline-block; margin-top: 18px; font-size: 13px; font-weight: 700; color: #eb5757; background: #fdeceb; border-radius: 999px; padding: 5px 14px; }
    </style>
  </head>
  <body>
    <div class="frame">
      <span class="badge">주간 트렌드 스카우팅 리포트</span>
      <div class="number-row">
        <span class="number">70</span><span class="number-unit">만뷰</span>
      </div>
      <div class="number-label">해외 최고 시간당 조회수(VPH) · 3주 연속 유지</div>
      <h1>해외에선 이미 터졌는데<br /><span class="accent">국내엔 아직 없음</span></h1>
      <p>3주 추적으로 검증한 해외-국내 콘텐츠 갭 리포트</p>
      <span class="tag">지금 국내 89건 중 0건</span>
    </div>
  </body>
</html>
